<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mango</title>
<meta name="description" content="Gastos, cuotas, deudas y cobros en un solo lugar.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mango">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E2A2B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<style>
/* Mango: un banco digital de bolsillo. Vidrio sobre verde y azul profundo, un número en el centro, naranja de mango para lo importante. */
:root {
  --fondo: #0E2A2B; --t1: #FFFFFF; --t2: rgba(255,255,255,.8); --t3: rgba(255,255,255,.64);
  --linea: rgba(232,245,233,.16); --borde: rgba(232,245,233,.26); --relleno: rgba(232,245,233,.13);
  --inv: #1E3A3A; --campo: rgba(4,20,22,.36); --menta: #E8F5E9;
  --mango: #FF9E1B; --mango-claro: #F4D03F;
  --bien: #8BE6A8; --bien-f: rgba(76,175,80,.26);
  --ojo: #F4D03F; --ojo-f: rgba(244,208,63,.18);
  --mal: #FFB3A7; --mal-f: rgba(255,120,100,.2);
  --azul: #D5EFDB; --azul-f: rgba(232,245,233,.17);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --r: 24px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--fondo); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--t1); font-family: var(--f); font-size: 15px; line-height: 1.35; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; top: -30vh; left: 0; right: 0; height: 160vh; height: calc(100lvh + 60vh); padding: 30vh 0; box-sizing: border-box; z-index: -1; background: radial-gradient(90vw 55vh at 96% 2%, rgba(95,190,140,.72), transparent 72%) content-box no-repeat, radial-gradient(95vw 65vh at 4% 100%, rgba(16,58,92,.95), transparent 74%) content-box no-repeat, radial-gradient(70vw 42vh at 92% 96%, rgba(255,158,27,.13), transparent 72%) content-box no-repeat, linear-gradient(170deg, #1E4A48, #0E2A2B 62%, #0F3044) border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--mango); outline-offset: 2px; }
.app { min-height: 100vh; min-height: 100lvh; align-content: start; max-width: 540px; margin-inline: auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.app > * { min-width: 0; }

/* Vidrio */
.bloque, .tabs > div, .icono, .aro, .vidrio, .toast {
  background: linear-gradient(140deg, rgba(255,255,255,.17), rgba(255,255,255,.04) 60%, rgba(255,255,255,.09)), rgba(6,26,30,.34);
  -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
  border: 1px solid var(--borde);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.38), inset 0 -1px 1px rgba(255,255,255,.08), 0 10px 28px rgba(0,0,0,.28);
}

/* Encabezados */
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 2px; }
.cab > div { min-width: 0; }
.saludo { align-items: flex-start; }
.saludo > div { display: grid; gap: 8px; justify-items: start; }
.pill.frase { white-space: normal; display: block; max-width: 100%; border-radius: 20px; padding: 9px 14px; font-size: 14px; line-height: 1.32; font-weight: 600; color: var(--t1); text-wrap: pretty; }
.pill.frase.bien { color: var(--bien); } .pill.frase.ojo { color: var(--ojo); } .pill.frase.mal { color: var(--mal); }
h1 { font-size: 28px; line-height: 1.1; font-weight: 700; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 14.5px; color: var(--t1); font-weight: 700; margin: 0; }
h3 { font-size: 16px; font-weight: 700; margin: 0; }
.sub { color: var(--t2); margin: 3px 0 0; }
.chico { font-size: 13px; color: var(--t2); }
.tercero { color: var(--t3); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.02em; }
.grande { font-size: 30px; line-height: 1.1; }
p { margin: 0; }
.v-bien { color: var(--bien); } .v-mal { color: var(--mal); } .v-ojo { color: var(--ojo); }
.entre { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.entre > * { min-width: 0; }
.grupo { margin: 2px 0 -6px 6px; }

/* Portada de Hoy */
.heroe { display: grid; gap: 4px; text-align: center; padding-block: 16px 6px; }
.heroe-et { font-size: 15px; color: var(--t2); }
.heroe-num { font-size: clamp(54px, 17vw, 68px); line-height: 1.04; background: linear-gradient(120deg, var(--mango-claro), var(--mango)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.heroe-pie { font-size: 15px; color: var(--t2); }
.accesos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.acceso { background: none; border: 0; padding: 0; display: grid; gap: 6px; justify-items: center; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--t1); }
.aro { width: 56px; height: 56px; border-radius: 99px; display: grid; place-items: center; }
.aro svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.num-fila { font-size: 18px; }
.logo-t { width: 24px; height: 15px; flex: none; display: inline-block; vertical-align: -3px; margin-right: 7px; border-radius: 3.5px; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
.punto { width: 9px; height: 9px; border-radius: 99px; display: inline-block; margin-right: 6px; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }

/* Bloques */
.bloque { border-radius: var(--r); padding: 15px; display: grid; gap: 10px; min-width: 0; }
.bloque > * { min-width: 0; }

/* Filas */
.lista { display: grid; }
.fila { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--linea); text-align: left; width: 100%; background: none; border-inline: 0; border-bottom: 0; min-width: 0; color: inherit; }
.lista > .fila:first-child { border-top: 0; padding-top: 1px; }
.lista > .fila:last-child { padding-bottom: 1px; }
button.fila { cursor: pointer; }
.fila .izq { min-width: 0; flex: 1; display: grid; gap: 2px; }
.fila .der { text-align: right; flex: none; display: grid; gap: 3px; justify-items: end; }
.fila .nom { font-weight: 600; overflow-wrap: anywhere; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.pill.bien { background: var(--bien-f); color: var(--bien); }
.pill.ojo { background: var(--ojo-f); color: var(--ojo); }
.pill.mal { background: var(--mal-f); color: var(--mal); }
.pill.neutro { background: var(--relleno); color: var(--t2); }
.pill.azul { background: var(--azul-f); color: var(--azul); }
.pill.vidrio { padding: 8px 14px; font-size: 13px; color: var(--t1); }

/* Botones */
.btn { appearance: none; -webkit-appearance: none; border: 1px solid var(--borde); background: var(--relleno); color: var(--t1); font-weight: 600; padding: 11px 16px; border-radius: 99px; cursor: pointer; text-align: center; min-height: 46px; }
.btn.prim { background: linear-gradient(135deg, #FFB83D, var(--mango)); border-color: transparent; color: var(--inv); font-weight: 700; }
.btn.peligro { color: var(--mal); }
.btn.mini { min-height: 36px; padding: 6px 13px; font-size: 13px; }
.btn.lleno { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }
.icono { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 99px; cursor: pointer; flex: none; padding: 0; color: var(--t1); }
.icono svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icono.mini { width: 34px; height: 34px; }
.icono:disabled { opacity: .4; }
.link { background: none; border: 0; color: var(--t1); font-weight: 600; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--borde); text-underline-offset: 3px; }

/* Cómo vas */
.barra { position: relative; height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; }
.barra > span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--mango-claro), var(--mango)); border-radius: 99px; }
.barra.mal > span { background: var(--mal); }
.barra.ojo > span { background: var(--ojo); }
.barra > i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; border-radius: 2px; }

/* Barras de meses */
.meses { display: grid; gap: 2px; }
.mes-f { display: grid; grid-template-columns: 30px minmax(0, 1fr) 86px 66px; gap: 8px; align-items: center; background: none; border: 0; padding: 8px 0; text-align: left; width: 100%; cursor: pointer; color: inherit; }
.mes-f.basico { grid-template-columns: 44px minmax(0, 1fr) 86px; }
.mes-f.cab-m { cursor: default; padding-block: 0 2px; font-size: 12px; color: var(--t3); }
.mes-f .m { font-weight: 600; text-transform: capitalize; }
.mes-f .v { text-align: right; font-size: 13.5px; }
.mes-b { height: 10px; display: block; }
.mes-b span { display: block; height: 100%; background: linear-gradient(90deg, var(--mango-claro), var(--mango)); border-radius: 99px; min-width: 2px; }
.mes-d { display: grid; gap: 3px; padding: 0 0 8px 40px; font-size: 13px; color: var(--t2); }
.mes-d div { display: flex; justify-content: space-between; gap: 8px; }

/* Formularios */
.campo { display: grid; gap: 5px; min-width: 0; }
.campo > label, .et-campo { font-size: 13px; font-weight: 600; color: var(--t2); }
.campo input, .campo select, .campo textarea { width: 100%; min-width: 0; padding: 12px 16px; font-size: 16px; border: 1px solid var(--borde); border-radius: 18px; background: var(--campo); min-height: 48px; color: var(--t1); }
.campo select { -webkit-appearance: none; appearance: none; }
.campo input::placeholder, .campo textarea::placeholder { color: var(--t3); }
input[type="date"] { -webkit-appearance: none; appearance: none; }
.fila-campos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: start; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--borde); background: var(--relleno); padding: 7px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 36px; color: var(--t1); }
.chip.on { background: var(--menta); border-color: var(--menta); color: var(--inv); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(4,20,22,.32); border: 1px solid var(--borde); border-radius: 99px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 8px 6px; border-radius: 99px; font-weight: 600; color: var(--t2); cursor: pointer; min-height: 38px; font-size: 14px; }
.seg button.on { background: var(--menta); color: var(--inv); }
.ayuda { font-size: 13px; color: var(--t2); }
.error { font-size: 13.5px; color: var(--mal); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 20px; height: 20px; flex: none; accent-color: var(--mango); }

/* Avisos y veredicto */
.aviso { display: grid; gap: 4px; padding: 11px 14px; border-radius: 18px; font-size: 13.5px; background: var(--ojo-f); color: var(--ojo); border: 1px solid rgba(244,208,63,.3); }
.aviso.azul { background: var(--azul-f); color: var(--azul); border-color: var(--borde); }
.aviso.mal { background: var(--mal-f); color: var(--mal); border-color: rgba(255,120,110,.34); }
.aviso .link { color: inherit; }
.veredicto { border-radius: var(--r); padding: 16px; display: grid; gap: 6px; border: 1px solid var(--borde); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.veredicto h3 { font-size: 23px; line-height: 1.15; letter-spacing: -.015em; text-wrap: balance; }
.veredicto.bien { background: var(--bien-f); } .veredicto.bien h3 { color: var(--bien); }
.veredicto.ojo { background: var(--ojo-f); } .veredicto.ojo h3 { color: var(--ojo); }
.veredicto.mal { background: var(--mal-f); } .veredicto.mal h3 { color: var(--mal); }
.veredicto .costo { font-weight: 600; padding-top: 8px; margin-top: 2px; border-top: 1px solid var(--linea); }

/* Tabla de opciones */
.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th { font-size: 12px; font-weight: 600; color: var(--t3); text-align: left; padding: 0 6px 6px 0; }
.tabla td { padding: 8px 6px 8px 0; border-top: 1px solid var(--linea); vertical-align: top; }
.tabla td:last-child, .tabla th:last-child { text-align: right; padding-right: 0; }
.tabla tr.elegida td { font-weight: 700; color: var(--mango-claro); }
.tabla tr.elegida td span { font-weight: 700; }

/* Barra flotante */
.tabs { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.tabs > div { position: relative; pointer-events: auto; max-width: 516px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 2px; border-radius: 99px; padding: 6px; }
.tab-fondo { position: absolute; left: 0; top: 6px; bottom: 6px; width: 0; border-radius: 99px; background: var(--menta); }
.tab { position: relative; z-index: 1; background: none; border: 0; padding: 0; flex: 1 1 0; min-width: 0; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--t1); cursor: pointer; border-radius: 99px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; opacity: .85; }
.tab span { display: none; }
.tab.on { flex: 0 0 auto; color: var(--inv); padding-inline: 13px; }
.tab.on svg { width: 19px; height: 19px; opacity: 1; }
.tab.on span { display: inline; }

/* Hoja inferior */
.hoja { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.hoja-fondo { position: absolute; inset: 0; background: rgba(4, 20, 22, .58); }
.hoja-panel { position: relative; width: 100%; max-width: 540px; max-height: 90%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: linear-gradient(160deg, rgb(38,84,78), rgb(12,36,40)); border-top: 1px solid var(--borde); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 40px 0 0 rgb(12,36,40); border-radius: 30px 30px 0 0; padding-top: 18px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
.hoja-panel > * { min-width: 0; }
.hoja-panel form { display: grid; gap: 12px; }
.hoja-panel form > * { min-width: 0; }
.hoja-panel .bloque { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
.hoja-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hoja-cab h2 { font-size: 22px; letter-spacing: -.015em; line-height: 1.15; }
.cerrar { background: var(--relleno); border: 1px solid var(--borde); color: var(--t1); border-radius: 99px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 17px; line-height: 1; }

/* Aviso flotante */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50; color: var(--t1); padding: 10px 16px; border-radius: 99px; display: flex; gap: 12px; align-items: center; font-size: 14px; max-width: calc(100% - 28px); width: max-content; background: linear-gradient(140deg, rgba(255,255,255,.2), rgba(255,255,255,.07)), rgba(8,30,32,.84); }
.toast button { background: none; border: 0; color: var(--t1); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 2px; white-space: nowrap; }
.inicio { padding-block: 40px 16px; display: grid; gap: 14px; }
.inicio.centro { text-align: center; justify-items: center; padding-top: 12vh; }
.inicio.centro .btn, .inicio.centro .ancho { width: 100%; text-align: left; }
.inicio.centro .btn { text-align: center; }
.logo { width: 92px; height: 92px; border-radius: 22%; box-shadow: 0 14px 34px rgba(0,0,0,.4); }
.accesos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
ol.pasos { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Festejo al cerrar una deuda */
.festejo { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none; }
.festejo-nucleo { display: grid; gap: 2px; text-align: center; padding: 16px 24px; border-radius: 24px; background: linear-gradient(140deg, rgba(255,255,255,.2), rgba(255,255,255,.06)), rgb(12,36,40); border: 1px solid var(--borde); box-shadow: 0 16px 40px rgba(0,0,0,.45); animation: festejo-nucleo 1.8s cubic-bezier(.2,1.1,.3,1) both; }
.festejo-nucleo strong { font-size: 19px; color: var(--mango-claro); }
.festejo-nucleo span { font-size: 14px; color: var(--t2); }
.festejo i { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 99px; background: var(--c); animation: chispa 1s cubic-bezier(.15,.7,.3,1) var(--d) both; }

/* Animaciones: pocas y con función. Se apagan con "Reducir movimiento". */
@media (prefers-reduced-motion: no-preference) {
  .tab-fondo { transition: transform .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1); }
  .tab { transition: color .18s ease; }
  .tab.on span { animation: fundir .22s ease both; }
  .entra .barra > span, .entra .mes-b span { transform-origin: left center; animation: llenar .7s cubic-bezier(.2,.8,.2,1) both; }
  .hoja-panel { animation: hoja-sube .36s cubic-bezier(.22,1.12,.36,1) both; }
  .hoja-fondo { animation: fundir .22s ease both; }
  .hoja.saliendo { z-index: 39; pointer-events: none; }
  .hoja.saliendo .hoja-panel { animation: hoja-baja .2s ease-in both; }
  .hoja.saliendo .hoja-fondo { animation: fundir-fuera .2s ease both; }
  .veredicto.salta { animation: salto .38s cubic-bezier(.2,1.2,.3,1) both; }
}
@keyframes fundir { from { opacity: 0; } }
@keyframes fundir-fuera { to { opacity: 0; } }
@keyframes llenar { from { transform: scaleX(0); } }
@keyframes hoja-sube { from { transform: translateY(100%); } }
@keyframes hoja-baja { to { transform: translateY(100%); } }
@keyframes salto { 0% { opacity: 0; transform: translateY(8px) scale(.95); } 100% { opacity: 1; transform: none; } }
@keyframes chispa { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 70% { opacity: 1; } to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); opacity: 0; } }
@keyframes festejo-nucleo { 0% { opacity: 0; transform: scale(.8); } 14% { opacity: 1; transform: none; } 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
/* Compu: menú al costado y pantallas anchas, en dos columnas. */
.marca { display: none; }
.solo-ancha { display: none; }
.tabla-cuotas td, .tabla-cuotas th { text-align: left; white-space: nowrap; }
.tabla-cuotas td.num, .tabla-cuotas th:nth-child(4), .tabla-cuotas th:nth-child(5) { text-align: right; padding-right: 18px; }
.tabla-cuotas td:last-child, .tabla-cuotas th:last-child { text-align: right; }
.tabla-cuotas tbody tr { cursor: pointer; }
.tabla-cuotas tbody tr:hover td { background: rgba(255,255,255,.05); }
.tabla-cuotas td:first-child { white-space: normal; }
@media (min-width: 960px) {
  body { font-size: 15.5px; }
  .app { max-width: 1180px; margin-left: 272px; margin-right: auto; padding: 28px 32px 48px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
  @media (min-width: 1500px) { .app { margin-left: max(272px, calc((100vw - 1180px) / 2 + 100px)); } }
  .app > .cab, .app > .aviso, .app > .veredicto, .app > .btns, .app > .seg, .app > .inicio, .app > p, .app > .grupo, .app > form, .app > section.ancho { grid-column: 1 / -1; }
  .app > .heroe { align-self: center; padding-block: 8px; }
  .app > .accesos { align-self: center; }
  .app > .seg { max-width: 420px; }
  .app > form.bloque { max-width: none; }
  .bloque { padding: 20px; }
  .tabs { inset: 0 auto 0 0; width: 248px; padding: 16px 0 16px 16px; bottom: 0; }
  .tabs > div { height: 100%; max-width: none; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; border-radius: 28px; padding: 18px 12px; }
  .marca { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; padding: 0 8px 18px; }
  .marca img { border-radius: 9px; }
  .tab-fondo { left: 12px; right: 12px; top: 0; bottom: auto; width: auto; height: 0; }
  .tab, .tab.on { flex: none; justify-content: flex-start; height: 46px; padding-inline: 14px; gap: 12px; font-size: 14.5px; }
  .tab span, .tab.on span { display: inline; }
  .tab svg, .tab.on svg { width: 20px; height: 20px; }
  .hoja { align-items: center; padding: 24px 24px 24px 272px; }
  .hoja-panel { max-width: 600px; max-height: 88vh; border-radius: 30px; border: 1px solid var(--borde); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 30px 60px rgba(0,0,0,.45); padding: 22px 24px 24px; }
  .toast { left: calc(50% + 124px); bottom: 28px; }
  .hoja-panel.ancha { max-width: 1060px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); column-gap: 22px; align-items: start; align-content: start; }
  .hoja-panel.ancha > .hoja-cab { grid-column: 1 / -1; }
  .hoja-panel.ancha > form { grid-column: 1; grid-row: 2 / span 30; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; align-items: start; }
  .hoja-panel.ancha > form > :is(h2, p, .btn.prim, .error) { grid-column: 1 / -1; }
  .hoja-panel.ancha > form > h2 { margin-top: 8px; }
  .hoja-panel.ancha > form > .btn.mini { justify-self: start; }
  .hoja-panel.ancha > :not(form):not(.hoja-cab) { grid-column: 2; }
  .inicio.centro { max-width: 420px; margin-inline: auto; }
  .solo-ancha { display: table; }
  .solo-celu { display: none; }
  .app > .grupo { margin-top: 6px; }
  body:has(#tabs[hidden]) .app { margin-inline: auto; grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 960px) and (prefers-reduced-motion: no-preference) {
  .hoja-panel { animation-name: hoja-aparece; }
  .hoja.saliendo .hoja-panel { animation-name: hoja-desaparece; }
}
@keyframes hoja-aparece { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes hoja-desaparece { to { opacity: 0; transform: translateY(12px) scale(.97); } }
</style>
